# 開発用: PostgreSQL（ほかの開発環境とぶつからないよう、ポートを既定からずらしている）
name: skaka
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: skaka
      POSTGRES_PASSWORD: skaka
      POSTGRES_DB: skaka
    ports: ["54350:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/docker/dev-initdb.sql:/docker-entrypoint-initdb.d/10-skaka-test.sql:ro   # テスト用DB skaka_test
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "skaka"]
      interval: 2s
      retries: 30
volumes:
  pgdata:
